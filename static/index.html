<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Short Drama Pipeline</title>
  <style>
    :root {
      --bg: #F4F4F6; --surface: #ffffff; --surface-2: #F4F4F6; --border: #E5E7EB; --border-2: #D1D5DB;
      --accent: #2563EB; --accent-2: #7C6FE3; --accent-3: #F472B6;
      --text-primary: #1E1E2E; --text-secondary: #6B7280;
      --success: #16A34A; --success-bg: rgba(34,197,94,0.10); --success-border: rgba(34,197,94,0.25);
      --danger: #E11D48; --danger-bg: rgba(225,29,72,0.08); --danger-border: rgba(225,29,72,0.18);
      --warn: #B45309; --warn-bg: rgba(245,158,11,0.10); --warn-border: rgba(245,158,11,0.30);
      --radius: 10px; --radius-sm: 6px;
      --font: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sidebar-w: 248px;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); padding: 20px; margin: 0; font-family: var(--font); font-size: 13px; line-height: 1.5; color: var(--text-primary); }
    a { color: var(--accent-2); }
    code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

    /* ---- shell ---- */
    .app { max-width: 1240px; margin: 0 auto 0 calc(var(--sidebar-w) + 8px); }
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); overflow-y: auto; background: var(--surface); border-right: 0.5px solid var(--border); padding: 16px 12px 24px; z-index: 20; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; font-size: 14px; font-weight: 600; }
    .sidebar-group { font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-secondary); margin: 14px 10px 6px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .sidebar-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0.5px solid transparent; border-radius: 8px; background: transparent; color: var(--text-secondary); padding: 8px 10px; font: 500 13px var(--font); cursor: pointer; }
    .sidebar-btn svg, .proj-tool-btn svg { width: 16px; height: 16px; flex: none; }
    .sidebar-btn:hover:not(:disabled) { background: rgba(124,111,227,0.05); color: var(--text-primary); }
    .sidebar-btn.active { background: rgba(124,111,227,0.10); border-color: rgba(124,111,227,0.28); color: var(--accent-2); }
    .sidebar-btn:disabled { opacity: .45; cursor: not-allowed; }
    .sidebar-done { color: var(--success); font-weight: 600; font-size: 12px; }
    @media (max-width: 960px) {
      .app { margin-left: auto; }
      .sidebar { position: static; width: auto; border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
      .sidebar-nav { flex-direction: row; flex-wrap: wrap; }
      .sidebar-btn { width: auto; }
    }

    .tool-heading { margin: 6px 0 16px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
    .section-heading { margin: 14px 0 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); }

    /* ---- projects ---- */
    .proj-list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
    .proj-new-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border: none; border-radius: var(--radius-sm); cursor: pointer; color: #fff; font: 500 12px var(--font); background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3)); }
    .proj-new-btn:hover { opacity: .92; }
    .proj-new-btn svg { width: 14px; height: 14px; }
    .proj-filter-bar { padding: 12px 14px; }
    .proj-search { position: relative; }
    .proj-search svg { position: absolute; left: 11px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    .proj-search input[type=text] { padding-left: 32px; height: 36px; }
    .proj-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 1000px) { .proj-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .proj-grid { grid-template-columns: 1fr; } }
    .proj-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .proj-card:hover { border-color: var(--accent-2); box-shadow: 0 2px 10px rgba(124,111,227,0.08); }
    .proj-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .proj-card-top > div:first-child { min-width: 0; flex: 1; }
    .proj-card-name { font-size: 14px; font-weight: 500; margin: 0 0 6px; overflow-wrap: anywhere; }
    .proj-type-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; background: rgba(124,111,227,0.10); color: var(--accent-2); border: 0.5px solid rgba(124,111,227,0.25); }
    .proj-meta { font-size: 11px; color: var(--text-secondary); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
    .proj-delete-btn { background: transparent; border: none; padding: 4px; cursor: pointer; color: var(--text-secondary); border-radius: 4px; flex: 0 0 auto; }
    .proj-delete-btn:hover { color: var(--danger); background: var(--danger-bg); }
    .proj-new-card { border: 1.5px dashed var(--border-2); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; min-height: 80px; }
    .proj-new-card:hover { border-color: var(--accent-2); color: var(--accent-2); }
    .proj-detail-back { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; margin-bottom: 14px; background: none; border: none; padding: 0; font-family: var(--font); }
    .proj-detail-back:hover { color: var(--accent-2); }
    .proj-detail-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .proj-detail-title input.proj-name-input { width: min(420px, 100%); font-size: 16px; font-weight: 500; height: 34px; border-color: transparent; background: transparent; padding: 4px 8px; margin-left: -8px; }
    .proj-detail-title input.proj-name-input:hover { border-color: var(--border); background: var(--surface); }
    .proj-tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (max-width: 1100px) { .proj-tools-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .proj-tools-grid { grid-template-columns: repeat(2, 1fr); } }
    .proj-tool-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font: 500 12px var(--font); color: var(--text-primary); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; }
    .proj-tool-btn svg { color: var(--accent-2); }
    .proj-tool-btn:hover { border-color: var(--accent-2); background: rgba(124,111,227,0.05); color: var(--accent-2); }
    .proj-tool-btn.done { border-color: var(--success-border); }
    .proj-result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; scroll-margin-top: 16px; }
    .proj-result-header { width: 100%; border: none; background: var(--surface-2); border-bottom: 0.5px solid var(--border); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; text-align: left; font-family: var(--font); color: var(--text-primary); }
    .proj-result-header-main { min-width: 0; display: grid; gap: 3px; }
    .proj-result-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .proj-result-title { font-size: 13px; font-weight: 500; }
    .proj-result-status { font-size: 10px; color: var(--accent-2); background: rgba(124,111,227,0.08); border: 0.5px solid rgba(124,111,227,0.2); border-radius: 999px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 4px; }
    .proj-result-status.ok { color: var(--success); background: var(--success-bg); border-color: var(--success-border); }
    .proj-result-status .spinner { width: 9px; height: 9px; border-width: 1.5px; }
    .proj-result-preview { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .proj-result-chevron { width: 16px; height: 16px; color: var(--text-secondary); flex: 0 0 auto; transition: transform .15s ease; }
    .proj-result-chevron.collapsed { transform: rotate(-90deg); }
    .proj-result-body { padding: 14px; }
    .proj-result-body .card { margin-bottom: 12px; }
    .proj-result-body .card:last-child { margin-bottom: 0; }

    /* ---- tool contents ---- */
    .sub { font-size: 12px; color: var(--text-secondary); margin: 0 0 12px; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
    .card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    label.f { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); margin: 12px 0 5px; }
    input[type=text], input[type=number], textarea, select { width: 100%; border: 0.5px solid var(--border-2); border-radius: var(--radius-sm); padding: 8px 11px; font: 13px var(--font); color: var(--text-primary); background: var(--surface); outline: none; }
    input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(124,111,227,0.10); }
    select, input[type=number] { width: auto; height: 32px; padding: 0 10px; }
    textarea { resize: vertical; min-height: 90px; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
    textarea.tall { min-height: 240px; }
    input[type=checkbox] { accent-color: var(--accent-2); }
    button.b, a.b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border-2); background: var(--surface); color: var(--text-primary); font: 500 12px var(--font); cursor: pointer; white-space: nowrap; text-decoration: none; transition: border-color .15s, background .15s, opacity .15s; }
    button.b:hover:not(:disabled), a.b:hover { border-color: var(--accent-2); background: rgba(124,111,227,0.04); }
    button.b.primary, a.b.primary { border: none; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3)); padding: 0 16px; }
    button.b.primary:hover:not(:disabled), a.b.primary:hover { opacity: .92; background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3)); }
    button.b.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
    button.b.sm, a.b.sm { height: 26px; padding: 0 9px; font-size: 11px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); border: 0.5px solid var(--border); font-weight: 500; }
    .pill.ok { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
    .pill.run { background: rgba(124,111,227,0.08); color: var(--accent-2); border-color: rgba(124,111,227,0.2); }
    .pill.bad { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .err, .error-box { border: 0.5px solid var(--danger-border); background: var(--danger-bg); color: var(--danger); border-radius: var(--radius-sm); padding: 8px 11px; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
    .note, .video-hint { color: var(--text-secondary); font-size: 12px; }
    .banner { border: 0.5px solid var(--warn-border); background: var(--warn-bg); color: var(--warn); border-radius: var(--radius-sm); padding: 9px 12px; margin-bottom: 12px; font-size: 12px; }
    .empty { border: 1.5px dashed var(--border-2); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--text-secondary); background: #FAFAFB; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
    .thumb { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; position: relative; }
    .thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface-2); cursor: zoom-in; }
    .thumb .cap { padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .thumb.sel { border-color: var(--accent-2); box-shadow: 0 0 0 2px var(--accent-2) inset; }
    .thumb .badge { position: absolute; top: 6px; left: 6px; background: var(--accent-2); color: #fff; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
    .pick, .pick img { cursor: pointer; }
    .pick:hover { border-color: var(--accent-2); }
    video { width: 100%; border-radius: var(--radius-sm); background: #000; display: block; }
    .shot-video { margin-top: 12px; max-width: 640px; }
    .video-pending { aspect-ratio: 16/9; display: grid; place-items: center; background: var(--surface-2); border: 0.5px dashed var(--border-2); border-radius: var(--radius-sm); }
    .part-card { border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; background: var(--surface); }
    .part-shots { margin-top: 6px; gap: 4px; }
    .split-btn { border: none; background: none; color: var(--text-secondary); cursor: pointer; font-size: 11px; padding: 0 2px; opacity: .45; }
    .split-btn:hover:not(:disabled) { opacity: 1; color: var(--accent-2); }
    .source-card { display: grid; grid-template-columns: 260px 1fr; gap: 14px; align-items: center; }
    @media (max-width: 700px) { .source-card { grid-template-columns: 1fr; } }
    .voice-gallery { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0 4px; max-height: 340px; overflow-y: auto; padding-right: 2px; }
    .voice-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .voice-card.playing { border-color: var(--accent-2); background: rgba(124,111,227,0.05); }
    .voice-card select { flex: 0 0 auto; }
    .voice-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
    .voice-info .note { font-size: 11px; }
    .voice-play { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; border: none; cursor: pointer; color: #fff; font-size: 11px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .voice-play:hover { opacity: .9; }
    .takes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    @media (max-width: 900px) { .takes { grid-template-columns: 1fr; } }
    .take { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
    .take.sel { border-color: var(--success); box-shadow: 0 0 0 1px var(--success) inset; }
    .take .note { color: var(--text-secondary); }
    .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(124,111,227,0.25); border-top-color: var(--accent-2); border-radius: 50%; animation: spin .8s linear infinite; }
    button.b.primary .spinner { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lightbox { position: fixed; inset: 0; background: rgba(15,15,25,.82); display: grid; place-items: center; z-index: 80; cursor: zoom-out; padding: 24px; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    .vt { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .vt td, .vt th { padding: 8px 6px; border-bottom: 0.5px solid var(--border); text-align: left; vertical-align: middle; }
    .vt th { color: var(--text-secondary); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    details summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
    pre.p { white-space: pre-wrap; font: 11.5px/1.55 var(--mono); background: var(--surface-2); border: 0.5px solid var(--border); padding: 10px; border-radius: var(--radius-sm); max-height: 300px; overflow: auto; margin: 6px 0 0; }
    audio { max-width: 100%; }
  </style>
  <link rel="stylesheet" href="/static/audiobook.css">
</head>
<body>
  <div id="root"></div>
  <script src="/static/react.production.min.js"></script>
  <script src="/static/react-dom.production.min.js"></script>
  <script src="/static/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="/static/audiobook.jsx"></script>
  <script type="text/babel" data-presets="react" src="/static/app.jsx"></script>
</body>
</html>
